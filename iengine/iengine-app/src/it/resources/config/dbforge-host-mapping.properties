# ============================================================================
# dbforge 租约 host 映射表：内网 host -> 实际连接用的可达 host
# ============================================================================
# 用途：仅“开发者在公网外、公司内网 IP 不可达”（场景 3）时启用，把 dbforge 租约返回的
#       内网 host 转换为公网可达 host；集群内 / CI（场景 1、2）直连内网地址，请勿启用。
#
# 启用方式（环境变量 DBF_IT_HOST_MAPPING）：
#   DBF_IT_HOST_MAPPING=true     使用本内置默认文件 config/dbforge-host-mapping.properties
#   DBF_IT_HOST_MAPPING=<path>   使用指定 .properties（classpath 优先，其次文件系统路径）
#   不设置                        不做任何转换（场景 1/2 直连内网；场景 4 回退静态 engine-connection.json）
#
# 规则：
#   键 = dbforge 租约返回的 external_host（内网 IP / advertise VIP）
#   值 = 从公网实际用于连接的 host（公网入口 IP / 域名）
#   端口（NodePort）保持不变，仅转换 host；未命中任何键的 host 原样使用。
#
# 集群 VIP -> 公网入口：
192.168.1.193=113.98.206.138
