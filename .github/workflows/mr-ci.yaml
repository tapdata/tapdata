name: Merge Request CI and Nightly Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "develop", "release-v*.*" ]
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      tapce_run:
        description: 'Tapce run or not'
        required: true
        type: boolean
        default: false
      tapdata_branch:
        description: 'tapdata branch'
        required: true
        type: string
        default: 'develop'

jobs:

  Get-Stable-Branch:
    runs-on: ubuntu-latest
    outputs:
      TAPDATA_BRANCH: ${{ steps.set-output.outputs.TAPDATA_BRANCH }}
      ENTERPRISE_BRANCH: ${{ steps.set-output.outputs.ENTERPRISE_BRANCH }}
      FRONTEND_BRANCH: ${{ steps.set-output.outputs.FRONTEND_BRANCH }}
      TAPCE_BRANCH: ${{ steps.set-output.outputs.TAPCE_BRANCH}}
      TAG_NAME: ${{ steps.set-output.outputs.TAG_NAME }}
    steps:
      - name: Checkout Tapdata Opensource
        uses: actions/checkout@v4
        with:
          repository: 'tapdata/tapdata'
          token: ${{ secrets.TAPDATA_ENT_CICD_TOKEN }}
          path: tapdata
          fetch-depth: 0
      - name: Set Tag
        run: |
          cd tapdata
          main_tag=$(git describe --tags | cut -d '-' -f 1)
          current_timestamp=$(date +%s)
          hex_timestamp=$(printf "%X" "$current_timestamp" | tr 'A-F' 'a-f')
          tag_name="$main_tag-$hex_timestamp"
          echo "TAG_NAME=$tag_name" >> $GITHUB_ENV
      - name: Checkout Tapdata Enterprise Web
        uses: actions/checkout@v4
        with:
          repository: 'tapdata/tapdata-enterprise-web'
          token: ${{ secrets.TAPDATA_ENT_CICD_TOKEN }}
          path: tapdata-enterprise-web
          fetch-depth: 0
      - name: Checkout Tapdata Enterpris
        uses: actions/checkout@v4
        with:
          repository: 'tapdata/tapdata-enterprise'
          token: ${{ secrets.TAPDATA_ENT_CICD_TOKEN }}
          path: tapdata-enterprise
          fetch-depth: 0
      - name: Checkout Tapdata Application
        uses: actions/checkout@v4
        with:
          repository: 'tapdata/tapdata-application'
          ref: "main"
          token: ${{ secrets.TAPDATA_ENT_CICD_TOKEN }}
          path: tapdata-application
      - name: Checkout Tapce
        uses: actions/checkout@v4
        with:
          repository: 'tapdata/tapce'
          ref: "main"
          token: ${{ secrets.TAPDATA_ENT_CICD_TOKEN }}
          path: tapce
      - name: Get Tapdata Branch Name -- Common
        run: |
          echo "TAPDATA_BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
      - name: Get Tapdata Branch Name -- Pr
        if: github.event_name == 'pull_request'
        run: |
          echo "TAPDATA_BRANCH=${{ github.event.pull_request.head.ref }}" >> $GITHUB_ENV
      - name: Get Tapdata Branch Name -- Workflow Dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "TAPDATA_BRANCH=${{ github.event.inputs.tapdata_branch }}" >> $GITHUB_ENV
      - name: Get Tapdata Branch Name -- Schedule
        if: github.event_name == 'schedule'
        run: |
          echo "TAPDATA_BRANCH=develop" >> $GITHUB_ENV
      - name: Get last stable branch
        id: set-output
        run: |
          cd tapdata-application
          TAPDATA_BRANCH=${{ env.TAPDATA_BRANCH }}
          ENTERPRISE_BRANCH="develop"
          FRONTEND_BRANCH="develop"
          TAPCE_BRANCH="develop"
          echo "::set-output name=TAPDATA_BRANCH::${TAPDATA_BRANCH}"
          echo "::set-output name=ENTERPRISE_BRANCH::${ENTERPRISE_BRANCH}"
          echo "::set-output name=FRONTEND_BRANCH::${FRONTEND_BRANCH}"
          echo "::set-output name=TAG_NAME::${TAG_NAME}"
          echo "::set-output name=TAPCE_BRANCH::${TAPCE_BRANCH}"

  Push-Code-To-Gitee:
    uses: ./.github/workflows/sync-code.yml
    needs: Get-Stable-Branch
    with:
      tapdata: ${{ needs.Get-Stable-Branch.outputs.TAPDATA_BRANCH }}
      tapdata-connectors: ''
      tapdata-enterprise-web: ''
      tapdata-application: 'main'
      docs: ''
    secrets:
      TAPDATA_ENT_CICD_TOKEN: ${{ secrets.TAPDATA_ENT_CICD_TOKEN }}
      GITEE_SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
      GITEE_KNOWN_HOSTS: ${{ secrets.GITEE_KNOWN_HOSTS }}

  Scan-Tapdata:
    runs-on: office-scan
    if: ${{ !startsWith(github.base_ref, 'release-v') && !(github.event_name == 'schedule' || inputs.tapce_run) }}
    needs:
      - Get-Stable-Branch
      - Push-Code-To-Gitee
    timeout-minutes: 120
    env:
      SONAR_EVENT_NAME: ${{ github.event_name }}
      SONAR_PR_KEY: ${{ github.event.pull_request.number }}
      SONAR_PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      SONAR_PR_BASE: ${{ github.event.pull_request.base.ref }}
      SONAR_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SONAR_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SONAR_BRANCH: ${{ needs.Get-Stable-Branch.outputs.TAPDATA_BRANCH }}
      API_SOURCE_REVISION: b09e683c27808598c01d85ab53cb29d500956d8f
    steps:
      - name: Clean Directory
        run: |
          rm -rf ./*
      - name: Set SSH Key
        run: |
          echo '${{ secrets.GITEE_SSH_KEY }}' > /root/.ssh/id_rsa
          chmod 600 /root/.ssh/id_rsa
          echo '${{ secrets.GITEE_KNOWN_HOSTS }}' > /root/.ssh/known_hosts
      - name: Checkout Tapdata Code
        run: |
          set -euo pipefail
          # Gitee mirrors same-repository PR branches only; fork PRs are not supported here.
          # Source/base SHA checks intentionally fail closed when the mirror is stale.
          git clone -b "$SONAR_BRANCH" git@gitee.com:${{ secrets.GITEE_USER }}/tapdata.git
          cd tapdata && git fetch --tags
          if [[ "$SONAR_EVENT_NAME" == pull_request ]]; then
            git check-ref-format --branch "$SONAR_PR_BASE" >/dev/null
            # Use the actual PR source, not a synthetic merge commit or a stale mirror.
            [[ "$(git rev-parse HEAD)" == "$SONAR_PR_HEAD_SHA" ]] || {
              echo "::error::Gitee source does not match the PR head SHA"; exit 1;
            }
            fetched=false
            for attempt in 1 2 3; do
              if timeout --kill-after=5s 60s git fetch --no-tags origin \
                "+refs/heads/$SONAR_PR_BASE:refs/remotes/origin/$SONAR_PR_BASE"; then
                fetched=true
                break
              fi
              sleep "$((attempt * 5))"
            done
            [[ "$fetched" == true ]] || { echo "::error::Cannot fetch PR target branch"; exit 1; }
            git cat-file -e "$SONAR_PR_BASE_SHA^{commit}" || {
              echo "::error::Gitee target mirror does not contain the PR base SHA"; exit 1;
            }
            git update-ref "refs/remotes/origin/$SONAR_PR_BASE" "$SONAR_PR_BASE_SHA"
            git merge-base HEAD "origin/$SONAR_PR_BASE" >/dev/null
          fi
      - name: Patch Maven Dependens
        env:
          RSYNC_PASSWORD: ${{ secrets.RSYNC_PASSWORD }}
        run: |
          : "${RSYNC_PASSWORD:?RSYNC_PASSWORD secret is required}"
          umask 077
          trap 'rm -f /tmp/rsync.passwd' EXIT
          printf '%s\n' "$RSYNC_PASSWORD" > /tmp/rsync.passwd
          # Seed missing third-party dependencies only; preserve private artifacts and settings.xml.
          # Not a refresh: stale/corrupt existing files require Maven updates or targeted repair.
          mkdir -p /root/.m2/repository
          rsync --password-file=/tmp/rsync.passwd -avz --ignore-existing --partial-dir=.rsync-partial \
            --exclude='/com/tapdata/***' --exclude='/io/tapdata/***' \
            rsync://root@fileserver.tapdata.net:873/data/enterprise-temp/tapdata/repository/ /root/.m2/repository/
      - name: Checkout verified API source
        uses: actions/checkout@v4
        with:
          repository: tapdata/tapdata-common-lib
          ref: ${{ env.API_SOURCE_REVISION }}
          token: ${{ secrets.TAPDATA_ENT_CICD_TOKEN }}
          path: tapdata-common-lib
          persist-credentials: false
      - name: Build verified API for this runner
        working-directory: tapdata
        run: |
          set -euo pipefail
          update-alternatives --set java /usr/java/jdk-17.0.12/bin/java
          export JAVA_HOME=/usr/java/jdk-17.0.12
          [[ "$(git -C ../tapdata-common-lib rev-parse HEAD)" == "$API_SOURCE_REVISION" ]]
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          ET.register_namespace("", ns["m"])
          version = ET.parse("iengine/pom.xml").findtext("m:properties/m:tapdata-api.version", namespaces=ns)
          if not version or not version.endswith("-SNAPSHOT"):
              raise SystemExit("Expected a scoped API snapshot version")
          pom = Path("../tapdata-common-lib/plugin-kit/tapdata-api/pom.xml")
          tree = ET.parse(pom)
          tree.find("m:version", ns).text = version
          tag = lambda name: "{" + ns["m"] + "}" + name
          build = tree.find("m:build", ns)
          if build is None:
              build = ET.SubElement(tree.getroot(), tag("build"))
          plugins = build.find("m:plugins", ns)
          if plugins is None:
              plugins = ET.SubElement(build, tag("plugins"))
          surefire = next((p for p in plugins if p.findtext("m:artifactId", namespaces=ns) == "maven-surefire-plugin"), None)
          if surefire is None:
              surefire = ET.SubElement(plugins, tag("plugin"))
              ET.SubElement(surefire, tag("artifactId")).text = "maven-surefire-plugin"
          plugin_version = surefire.find("m:version", ns)
          if plugin_version is None:
              plugin_version = ET.SubElement(surefire, tag("version"))
          plugin_version.text = "3.2.5"
          tree.write(pom, encoding="utf-8", xml_declaration=True)
          print("Building verified API source as " + version)
          PY
          mvn -B -ntp -f ../tapdata-common-lib/plugin-kit/tapdata-api/pom.xml install
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = Path("../tapdata-common-lib/plugin-kit/tapdata-api/target/surefire-reports")
          suites = [ET.parse(p).getroot() for p in reports.glob("TEST-*.xml")]
          tests = sum(int(s.get("tests", "0")) - int(s.get("skipped", "0")) for s in suites)
          if tests <= 0:
              raise SystemExit("Verified API build executed zero tests")
          print("Verified API tests: " + str(tests))
          PY
      - name: Build Tapdata - And Analyze
        env:
          GITHUB_TOKEN: ${{ secrets.TAPDATA_ENT_CICD_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          update-alternatives --set java /usr/java/jdk-17.0.12/bin/java
          export JAVA_HOME=/usr/java/jdk-17.0.12
          cd tapdata
          # BEGIN sonar mode
          sonar_args=()
          if [[ "${SONAR_EVENT_NAME:-}" == pull_request ]]; then
            [[ "${SONAR_PR_KEY:-}" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid Sonar PR key" >&2; exit 1; }
            : "${SONAR_PR_BRANCH:?PR source branch is required}" "${SONAR_PR_BASE:?PR target branch is required}"
            git check-ref-format --branch "$SONAR_PR_BRANCH" >/dev/null || exit "$?"
            git check-ref-format --branch "$SONAR_PR_BASE" >/dev/null || exit "$?"
            sonar_args=("-Dsonar.pullrequest.key=$SONAR_PR_KEY"
                        "-Dsonar.pullrequest.branch=$SONAR_PR_BRANCH"
                        "-Dsonar.pullrequest.base=$SONAR_PR_BASE"
                        "-Dsonar.java.skipUnchanged=true")
          else
            : "${SONAR_BRANCH:?Sonar branch is required}"
            git check-ref-format --branch "$SONAR_BRANCH" >/dev/null || exit "$?"
            sonar_args=("-Dsonar.branch.name=$SONAR_BRANCH")
          fi
          # END sonar mode
          # Install reactor artifacts for the following scan; package/install overhead is intentional.
          # Do not add skipTests: keep the same unit-test coverage as the former clean test lifecycle.
          # Persistent runner caches may contain previous failed downloads; force a resolution retry.
          mvn -U clean install -T1C -Dmaven.compile.fork=true -P idaas || exit "$?"
          mvn -U -P idaas org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=tapdata -Dsonar.host.url=${{ secrets.SONAR_HOST }} \
            -Dsonar.login=${{ secrets.SONAR_USER }} -Dsonar.password=${{ secrets.SONAR_PASS }} \
            "${sonar_args[@]}" \
            || exit "$?"
          update-alternatives --set java /usr/java/jdk1.8.0_361/bin/java
          export JAVA_HOME=/usr/java/jdk1.8.0_361
      - name: Prevent Skip Unittest
        run: |
          cd tapdata
          find ./ -name jacoco | grep iengine
          find ./ -name jacoco | grep manager
      - name: Install Dependens
        run: |
          apt install -y jq
      - name: SonarQube Quality Gate check
        id: sonar
        uses: sonarsource/sonarqube-quality-gate-action@master
        env:
           SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: tapdata/target/sonar/report-task.txt
          pollingTimeoutSec: 1200
      - name: Send SonarQube Quality Gate to Pr Comment
        if: ${{ always() && steps.sonar.outcome == 'failure' }}
        run: |
          pr_args=()
          if [[ "$SONAR_EVENT_NAME" == pull_request ]]; then
            pr_args=(--pull-request="$SONAR_PR_KEY")
          fi
          cd tapdata/build/ && bash check_sonarqube.sh --project-key=tapdata --branch="$SONAR_BRANCH" "${pr_args[@]}" \
             --sonar-token=${{ secrets.SONAR_TOKEN }} --github-token=${{ secrets.TAPDATA_ENT_CICD_TOKEN }} \
             --repo=tapdata --pr-number=${{ github.event.pull_request.number }}

  Build-Deploy-Test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || inputs.tapce_run }}
    needs:
      - Push-Code-To-Gitee
      - Get-Stable-Branch
    outputs:
      IP: ${{ steps.get_ip_port.outputs.IP }}
      PORT: ${{ steps.get_ip_port.outputs.PORT }}
    steps:
      - name: Trigger - Build - Deploy - Test
        uses: convictional/trigger-workflow-and-wait@v1.6.1
        with:
          owner: tapdata
          repo: tapdata-application
          github_token: ${{ secrets.TAPDATA_ENT_CICD_TOKEN }}
          workflow_file_name: build-tapdata-op.yaml
          ref: main
          wait_interval: 60
          client_payload: '{"BUILD_CONFIG": "{\"FRONTEND_BRANCH\": \"${{ needs.Get-Stable-Branch.outputs.FRONTEND_BRANCH }}\", \"OPENSOURCE_BRANCH\": \"${{ needs.Get-Stable-Branch.outputs.TAPDATA_BRANCH }}\", \"ENTERPRISE_BRANCH\": \"${{ needs.Get-Stable-Branch.outputs.ENTERPRISE_BRANCH }}\", \"CONNECTORS_BRANCH\": \"develop#develop\", \"TAG_NAME\": \"${{ needs.Get-Stable-Branch.outputs.TAG_NAME }}\"}", "CONNECTORS-OPTIONS": "nightly-build", "JAVA_VERSION": "java17", "RUN_TEST": true}'
          propagate_failure: false
          trigger_workflow: true
          wait_workflow: true
