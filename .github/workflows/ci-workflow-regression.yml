name: CI Workflow Regression

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tests/ci/**'
      - 'build/check_sonarqube.sh'
      - 'build/prepare-maven-ci-settings.py'
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/**'
      - 'tests/ci/**'
      - 'build/check_sonarqube.sh'
      - 'build/prepare-maven-ci-settings.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-workflow-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Uses Ruby, Python, Bash and Git; no Maven, secrets or private runners.
      - name: Ensure test library is available
        run: |
          ruby -e 'require "minitest"' ||
            gem install --user-install minitest -v 5.25.5 --no-document
      - name: Test Maven workflow and Sonar PR mode
        run: ruby tests/ci/maven_workflow_test.rb
      - name: Test Maven mirror routing and private settings preservation
        run: python3 -m unittest discover -s tests/ci -p '*_test.py'
