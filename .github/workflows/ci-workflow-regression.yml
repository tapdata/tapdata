name: CI Workflow Regression

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tests/ci/**'
      - 'build/build.sh'
      - 'build/check_sonarqube.sh'
      - 'build/*frontend-node*'
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/**'
      - 'tests/ci/**'
      - 'build/build.sh'
      - 'build/check_sonarqube.sh'
      - 'build/*frontend-node*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-workflow-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # These tests use local fixtures and do not need repository secrets or private runners.
      - name: Ensure test library is available
        run: |
          ruby -e 'require "minitest"' ||
            gem install --user-install minitest -v 5.25.5 --no-document
      - name: Test Maven workflow and Sonar PR mode
        run: ruby tests/ci/maven_workflow_test.rb
      - name: Test open-source frontend tooling
        run: ruby tests/ci/frontend_tooling_test.rb
